name: release

# Pushing a tag vX.Y.Z (matching sixamp.__version__, with a "## [X.Y.Z]" section in CHANGELOG.md) builds SIXAMP,
# uploads it to PyPI and then creates the GitHub release (notes from CHANGELOG.md, wheel and sdist attached).
#
# PyPI Trusted Publishing: no API token is stored in the repository. One-time setup on pypi.org:
# Account -> Publishing -> add a (pending) publisher: owner pez2001, repository sixamp, workflow release.yml,
# environment pypi.
on:
  push:
    tags: ["v*"]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.13"}
      - name: the tag must match the version in the code
        run: |
          v=$(python -c "import ast; print(next(n.value.value for n in ast.parse(open('sixamp.py').read()).body if isinstance(n, ast.Assign) and n.targets[0].id == '__version__'))")
          [ "${GITHUB_REF_NAME#v}" = "$v" ] || { echo "tag $GITHUB_REF_NAME does not match __version__ $v"; exit 1; }
      - name: release notes from CHANGELOG.md
        run: |
          v="${GITHUB_REF_NAME#v}"
          awk -v v="$v" 'index($0, "## [" v "]") == 1 {f = 1; next} f && /^(## |\[)/ {exit} f' CHANGELOG.md > notes.md
          [ -n "$(tr -d '[:space:]' < notes.md)" ] || { echo "CHANGELOG.md has no '## [$v]' section"; exit 1; }
          cat notes.md
      - run: pip install build twine
      - run: python -m build
      - run: twine check --strict dist/*
      - uses: actions/upload-artifact@v4
        with: {name: dist, path: dist/}
      - uses: actions/upload-artifact@v4
        with: {name: notes, path: notes.md}

  pypi:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/sixamp/
    permissions:
      id-token: write            # lets PyPI verify that the upload comes from this workflow
    steps:
      - uses: actions/download-artifact@v4
        with: {name: dist, path: dist/}
      - uses: pypa/gh-action-pypi-publish@release/v1

  github-release:
    needs: pypi                  # announce only what can really be installed
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with: {name: dist, path: dist/}
      - uses: actions/download-artifact@v4
        with: {name: notes, path: .}
      - uses: softprops/action-gh-release@v2
        with:
          name: SIXAMP ${{ github.ref_name }}
          body_path: notes.md
          files: dist/*
          make_latest: true
